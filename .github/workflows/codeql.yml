name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07  # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'c-cpp' && 'autobuild' || 'none' }}

      - name: Install build dependencies
        if: matrix.language == 'c-cpp'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # ubuntu-latest ships PGDG's libpq-dev (newer than the distro's), and the distro's
          # postgresql-server-dev-all then cannot be satisfied. Take the server headers from
          # PGDG too, pinned to PG 16 like the other workflows, and put its pg_config first
          # on PATH so the Makefile (PG_CONFIG = pg_config) builds against it.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget gnupg lsb-release ca-certificates
          sudo install -d /etc/apt/keyrings
          wget --timeout=30 --tries=3 --max-redirect=0 -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /etc/apt/keyrings/pgdg.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              build-essential libpq-dev libssl-dev pkg-config postgresql-server-dev-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Autobuild
        if: matrix.language == 'c-cpp'
        uses: github/codeql-action/autobuild@4187e74d05793876e9989daffde9c3e66b4acd07  # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07  # v3
        with:
          category: "/language:${{ matrix.language }}"
