services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: demo
    environment:
      POSTGRES_PASSWORD: fractalsql
      POSTGRES_DB: fractalsql_demo
      FSQL_REASONING_HTTP_TIMEOUT_MS: "330000"
      FSQL_REASONING_HTTP_LOW_SPEED_SECS: "300"
    ports:
      - "15432:5432"
    command: >
      postgres
      -c fractalsql.reasoning_plugin=/usr/lib/postgresql/18/lib/fractalsql-reasoning-http.so
      -c fractalsql.http_url=http://ollama:11434/v1/chat/completions
      -c fractalsql.http_allow_plaintext=on
      -c fractalsql.http_model=gpt-oss:20b
      -c fractalsql.http_embed_url=http://ollama:11434/v1/embeddings
      -c fractalsql.http_embed_model=nomic-embed-text
      -c fractalsql.http_think=off
      -c fractalsql.http_think_provider=ollama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  pull-model:
    image: ollama/ollama:latest
    profiles: ["pull-model"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull gpt-oss:20b && ollama pull nomic-embed-text"]

  pgvector-init:
    image: postgres:18-bookworm
    profiles: ["pgvector"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: fractalsql
    entrypoint:
      - /bin/sh
      - -c
      - >
        createdb -h postgres -U postgres fractalsql_bench 2>/dev/null || true;
        psql -h postgres -U postgres -d fractalsql_bench -v ON_ERROR_STOP=0 -c 'CREATE EXTENSION IF NOT EXISTS vector' -c 'CREATE EXTENSION IF NOT EXISTS fractalsql';
        psql -h postgres -U postgres -d fractalsql_demo -v ON_ERROR_STOP=0 -c 'CREATE EXTENSION IF NOT EXISTS vector'

volumes:
  ollama_data:
