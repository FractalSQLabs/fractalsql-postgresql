# sonar-project.properties: fractalsql-postgresql.
#
# Suppressions for intentional patterns (test fixtures, demo SQL,
# harness scaffolding). Pending rule keys are placeholders: if a
# finding reappears on scan, copy the exact key from its issue page.
sonar.projectKey=postgresql_fractalsql
sonar.projectName=fractalsql-postgresql

# Intentional crash/trigger-file behavior exercised by the test gates.
sonar.issue.ignore.multicriteria=e10,e13,e15,e16,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31
sonar.issue.ignore.multicriteria.e10.ruleKey=cpp:S5443
sonar.issue.ignore.multicriteria.e10.resourceKey=tests/evil_*.c
sonar.issue.ignore.multicriteria.e13.ruleKey=cpp:S2259
sonar.issue.ignore.multicriteria.e13.resourceKey=tests/evil_crash_plugin.c
sonar.issue.ignore.multicriteria.e15.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e15.resourceKey=scripts/ci/mock_llm.py
sonar.issue.ignore.multicriteria.e16.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e16.resourceKey=docker/Dockerfile.test

# Demo prompts are multi-line PostgreSQL string literals (valid SQL).
sonar.issue.ignore.multicriteria.e19.ruleKey=plsql:LiteralsNonPrintableCharactersCheck
sonar.issue.ignore.multicriteria.e19.resourceKey=demo/*.sql

# Extension SQL runs under CREATE EXTENSION; constants are not possible
# there, and objects should fail loudly if they already exist.
sonar.issue.ignore.multicriteria.e20.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e20.resourceKey=sql/fractalsql--1.0.sql
sonar.issue.ignore.multicriteria.e21.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e21.resourceKey=sql/fractalsql--1.0.sql

# Demo SQL idioms: commented alternatives as inline docs, SELECT *
# full-row display, deliberate CROSS JOIN cartesian products.
sonar.issue.ignore.multicriteria.e22.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e22.resourceKey=demo/*.sql
sonar.issue.ignore.multicriteria.e23.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e23.resourceKey=demo/*.sql
sonar.issue.ignore.multicriteria.e24.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e24.resourceKey=demo/*.sql

# Test-harness scaffolding literals.
sonar.issue.ignore.multicriteria.e25.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e25.resourceKey=build_test.sh
sonar.issue.ignore.multicriteria.e26.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e26.resourceKey=demo/demo-workload.sh

# PostgreSQL extension idioms: K&R declarations (backlog), API-forced
# wide signatures, nested-break complexity (out of scope).
sonar.issue.ignore.multicriteria.e27.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e27.resourceKey=src/fractalsql.c
sonar.issue.ignore.multicriteria.e28.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e28.resourceKey=src/fractalsql_vector.c
sonar.issue.ignore.multicriteria.e29.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e29.resourceKey=src/fractalsql.c
sonar.issue.ignore.multicriteria.e30.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e30.resourceKey=src/fractalsql.c

# Signature fixed by the plugin ABI every fixture implements.
sonar.issue.ignore.multicriteria.e31.ruleKey=RULE_KEY_CONFIRM_ME
sonar.issue.ignore.multicriteria.e31.resourceKey=tests/evil_crash_plugin.c

