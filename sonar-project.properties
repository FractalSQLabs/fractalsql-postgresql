# sonar-project.properties: fractalsql-postgresql.
sonar.projectKey=postgresql_fractalsql
sonar.projectName=fractalsql-postgresql

# Suppressed rules for intentional test-fixture patterns the test
# harness exercises by design. Rule keys are best-guess: if a finding
# reappears on scan, take the exact key from its issue page.
sonar.issue.ignore.multicriteria=e10,e13,e15,e16

sonar.issue.ignore.multicriteria.e10.ruleKey=cpp:S5443
sonar.issue.ignore.multicriteria.e10.resourceKey=tests/evil_*.c

sonar.issue.ignore.multicriteria.e13.ruleKey=cpp:S2259
sonar.issue.ignore.multicriteria.e13.resourceKey=tests/evil_crash_plugin.c

sonar.issue.ignore.multicriteria.e15.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e15.resourceKey=scripts/ci/mock_llm.py

sonar.issue.ignore.multicriteria.e16.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e16.resourceKey=docker/Dockerfile.test

# Pending rule-key confirmation: uncomment the pair and add its ID to
# the master list above.
# sonar.issue.ignore.multicriteria.e17.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e17.resourceKey=docker/Dockerfile
# sonar.issue.ignore.multicriteria.e18.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e18.resourceKey=demo/demo-workload.sh

sonar.exclusions=**/scripts/confidence/out/**, **/dist/**, **/build/**, **/node_modules/**

sonar.tests=tests,test