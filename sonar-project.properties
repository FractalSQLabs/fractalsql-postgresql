# sonar-project.properties — fractalsql-postgresql
sonar.projectKey=postgresql_fractalsql
sonar.projectName=fractalsql-postgresql

# sonar-project.properties
#
# SonarQube analysis configuration for this repo.
#
# The POSIX assert_*.sh scripts under docker/ (and fractalsql-core's
# scripts/) are INTENTIONALLY POSIX sh — they declare #!/bin/sh so they
# can run inside minimal builder container stages where bash may be
# absent. SonarQube's "prefer [[ over [" rule doesn't apply to POSIX
# scripts (bash's [[ is not POSIX syntax). The first line of each such
# script also carries `# shellcheck shell=sh` which tells ShellCheck-
# based analysis to use POSIX rules.
#
# If SonarQube still flags the rule anyway (e.g., the ShellCheck plugin
# isn't installed, or SonarQube's own shell analyzer is stricter),
# uncomment the multicriteria block below and set the `ruleKey` to
# whatever ID your SonarQube instance uses for the "prefer [[ over ["
# rule. Common candidates depending on your version:
#
#   shellcheck:SC2292       (ShellCheck — usually goes the OTHER way,
#                            so only applies if your version is inverted)
#   shell:S6599             (SonarQube native, newer versions)
#   shell:S1313             (SonarQube native, older versions)
#
# Replace RULE_KEY below with the matching key once you confirm it
# from the SonarQube issues dashboard.

# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=RULE_KEY
# sonar.issue.ignore.multicriteria.e1.resourceKey=docker/assert_so.sh

# ---------------------------------------------------------------------
# 2026-08-31 maintainability/security triage: categories below are
# structurally false-positive or actively wrong to "fix" HERE, not
# just deferred. Each was verified against real findings in the
# dashboard, not assumed from the rule description alone. Every
# ruleKey is a best-guess pending confirmation from your dashboard
# (click the finding -> the rule key is shown near "Why is this an
# issue") -- these entries are LEFT COMMENTED OUT until you've
# confirmed each key against this SonarQube instance's actual rule
# IDs, same posture as e1 above. Uncomment sonar.issue.ignore.multicriteria
# below (adding e2,e3,e4,e5,e6,e7,e8,e10,e11,e12 to the list -- e9 is
# deliberately not a suppression, see its own note below) once the
# keys are confirmed.

# e2: "Move declarations of types of parameters for function into list
# of parameters" (~70 findings, src/fractalsql.c + src/fractalsql_vector.c).
# Confirmed false positive: every instance is `Datum foo(PG_FUNCTION_ARGS)`
# -- PostgreSQL's OWN standard macro for every C-callable SQL function
# (expands to `FunctionCallInfo fcinfo`, defined in PG's fmgr.h). Sonar's
# C parser doesn't have PostgreSQL's headers/macros, so it misreads the
# macro invocation as an old K&R-style declaration. Not a real issue in
# any PostgreSQL C extension, this one included.
# sonar.issue.ignore.multicriteria.e2.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e2.resourceKey=src/fractalsql.c
# sonar.issue.ignore.multicriteria.e3.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e3.resourceKey=src/fractalsql_vector.c

# e4: "Define a constant instead of duplicating this literal N times"
# (~90 findings, almost entirely demo/*.sql + the two extension SQL
# files). Demo scripts are meant to be standalone and copy-pasteable --
# a reader following along shouldn't have to chase a constants table to
# understand one script. Introducing named constants here would work
# against the files' actual purpose. (Real product code -- src/*.c --
# is NOT covered by this exclusion; only demo/SQL literal duplication.)
# sonar.issue.ignore.multicriteria.e4.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e4.resourceKey=demo/**/*.sql

# e5: "Remove this commented-out code" (~20 findings, demo/*.sql).
# Verified several: these are deliberate "uncomment to try this"
# interactive examples with explanatory prose directly above them
# (e.g. "interactive only -- raises an ERROR, uncomment to confirm it
# rejects cleanly"), not dead code left behind by accident.
# sonar.issue.ignore.multicriteria.e5.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e5.resourceKey=demo/**/*.sql

# e6: PowerShell "Write-Host is not pipeline-compatible, prefix with
# Show- or use Write-Output" naming convention (build_test.ps1, several
# functions). Write-Host is the deliberately correct choice for colored
# pass/fail CI console output in a script nothing else pipes from;
# renaming to satisfy a verb-noun convention on a private, non-exported
# test script gains nothing.
# sonar.issue.ignore.multicriteria.e6.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e6.resourceKey=build_test.ps1

# e7/e10: two DIFFERENT rules on tests/**, so two entries -- a
# resourceKey with no ruleKey would match ANY rule on that path, which
# is broader than intended. Deprecated-CRT-function warnings
# (fopen/fscanf/getenv/strcpy -> _s variants, tests/windows/*.c) and
# "publicly writable directory" hotspots (tests/evil_*.c). Same
# reasoning for both: CI-only test fixtures (evil/mock/retry
# reasoning-VFS plugins), never shipped in the actual extension,
# running in an ephemeral single-tenant CI container. The MSVC
# _s-suffixed variants are also non-portable and would need #ifdef
# guards for zero real safety benefit here.
# sonar.issue.ignore.multicriteria.e7.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e7.resourceKey=tests/windows/**
# sonar.issue.ignore.multicriteria.e10.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e10.resourceKey=tests/evil_*.c

# e8/e11/e12: THREE different rules, verified against real flagged
# instances individually (not guessed from the rule description):
# "SELECT * should not be used" (a dynamically-created temp table with
# no fixed column list to name), "Avoid cross join queries" (deliberate
# all-pairs covariance-matrix construction), "illegal character code
# point 10 in this literal" (literal newlines inside single-quoted
# multi-line prompt strings -- valid, idiomatic PostgreSQL SQL; this
# rule appears to assume a stricter SQL dialect than Postgres actually
# enforces). All in demo/*.sql.
# sonar.issue.ignore.multicriteria.e8.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e8.resourceKey=demo/**/*.sql
# sonar.issue.ignore.multicriteria.e11.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e11.resourceKey=demo/**/*.sql
# sonar.issue.ignore.multicriteria.e12.ruleKey=RULE_KEY_CONFIRM_ME
# sonar.issue.ignore.multicriteria.e12.resourceKey=demo/**/*.sql

# e9: Cognitive-complexity / nesting-depth refactor findings (~25,
# build_test.ps1 + src/*.c) are DELIBERATELY NOT addressed here at
# all -- there is no sonar.issue.ignore.multicriteria entry for them.
# The complexity THRESHOLD is a server-side Quality Profile setting
# (Rules -> the specific complexity rule -> parameters), not something
# this project-local properties file can override. Mechanically
# extracting sub-functions from extensively live-tested C UDFs and
# gate functions purely to satisfy a metric is real regression risk
# for no functional benefit -- if this becomes a priority, it should
# be a deliberate, individually-reviewed refactor with its own test
# pass, not a suppressed rule.

# Exclude confidence-harness output (timestamped per-run JSON + logs,
# regenerated every build; not source).
sonar.exclusions=**/scripts/confidence/out/**, **/dist/**, **/build/**, **/node_modules/**

# Test source roots — pointed at existing test trees where present.
# Harmless when absent; SonarQube ignores missing paths.
sonar.tests=tests,test
